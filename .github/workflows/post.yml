name: ig-autopilot

on:
  schedule:
    - cron: "35 3 * * *"    # 09:05 IST (offset to avoid GitHub Actions :30 traffic jam)
    - cron: "35 13 * * *"   # 19:05 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Draft only (do not post to Instagram)"
        type: boolean
        default: false
      post_type:
        description: "Content format to publish"
        type: choice
        options:
          - reel
          - carousel
          - auto
        default: reel

permissions:
  contents: write

concurrency:
  group: ig-autopilot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
          UPLOADER: github
          IG_HANDLE: "@abhijeetkumar.founder"
          AUTO_POST: "true"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_FLAG=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_FLAG="--dry-run"
            fi
            python main.py --once $DRY_FLAG --type "${{ inputs.post_type }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 12 ]; then
              echo "Evening run detected: Generating and publishing Reel..."
              python main.py --once --type reel
            else
              echo "Morning run detected: Generating and publishing Carousel..."
              python main.py --once --type carousel
            fi
          fi

      - name: Upload drafts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drafts
          path: output/
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "ig-autopilot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
